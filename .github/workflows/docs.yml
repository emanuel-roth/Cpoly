name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      # SageMath is not installed here; docs/conf.py mocks it for autodoc.
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-luatex tex-gyre fonts-freefont-otf xindy

      - name: Build HTML
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      # The PDF is not committed; it is built here and served next to the
      # HTML at _static/cpoly.pdf (linked from index.rst and the README).
      - name: Build PDF
        run: |
          sphinx-build -M latexpdf docs docs/_build
          cp docs/_build/latex/cpoly.pdf docs/_build/html/_static/cpoly.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
